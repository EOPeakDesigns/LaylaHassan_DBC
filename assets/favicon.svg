<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background with gradient from color palette -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7eb5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d5c7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#97d9ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded rectangle background -->
  <rect width="64" height="64" rx="12" fill="url(#bgGradient)"/>
  
  <!-- Initials "LH" in white -->
  <text x="32" y="44" font-family="Poppins, sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="#ffffff">LH</text>
</svg>

