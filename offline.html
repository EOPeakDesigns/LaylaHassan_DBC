<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7FC9C3">
  <title>Offline — Layla Hassan</title>
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/base.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: var(--color-bg);
    }

    .offline-card {
      width: min(360px, 100%);
      padding: 2rem 1.5rem;
      border-radius: var(--border-radius-lg);
      background: var(--color-card);
      box-shadow: var(--card-shadow);
      text-align: center;
      font-family: 'Poppins', sans-serif;
    }

    .offline-card h1 {
      margin: 0 0 0.75rem;
      font-size: 1.35rem;
      background-image: var(--gradient-name);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .offline-card p {
      margin: 0 0 1.25rem;
      color: var(--color-text-light);
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .offline-card a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 44px;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      background: var(--gradient-name);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <h1>You're offline</h1>
    <p>Connect to the internet to view Layla Hassan's digital business card.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
